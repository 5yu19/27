<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 JUNE Retro Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Londrina+Solid:wght@400;900&display=swap" rel="stylesheet">
    <style>
        /* 폰트 및 기본 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Londrina Solid', 'Do Hyeon', sans-serif; 
        }

        /* 전체 배경 (연한 파랑 & 하단은 바다 느낌 대신 단색 처리) */
        body {
            background-color: #cde6f5; /* 다시 연한 파란색으로 복구 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 포스터 전체 컨테이너 */
        .poster {
            width: 100%;
            max-width: 620px; /* 달력 전체 크기 확대 */
            display: flex;
            flex-direction: column; /* 가로 배치에서 세로 배치로 변경 */
            align-items: center;
            gap: 5px; /* 타이틀과 달력 사이 여백 축소 */
            position: relative;
        }

        /* 가로 모드 좌측 정보 영역 */
        .info-section {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end; /* JUNE 글씨 아래 라인에 맞춤 */
        }

        /* 상단 텍스트 영역 */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 0; /* 타이틀 하단 여백 제거 */
        }

        .calendar-container {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .year {
            color: #a53332;
            font-size: 3rem;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 0;
        }

        .month {
            color: #a53332;
            font-size: 8rem; /* 훨씬 크게 */
            letter-spacing: -2px;
            line-height: 0.8; /* 위아래 간격 좁게 조정 */
            margin-bottom: 0;
            text-transform: uppercase;
        }

        .subtitle-banner {
            background-color: #bd2a2e;
            color: #f9a8b6; /* 연분홍 글씨 */
            display: inline-block;
            padding: 4px 15px;
            font-size: 0.9rem;
            transform: rotate(-2deg); /* 살짝 삐뚤어진 레트로 느낌 */
            margin-left: 50px;
        }

        .calendar-wrapper {
            padding: 30px 30px 15px 30px; /* 하단 여백 축소 */
            position: relative;
            z-index: 1;
        }

        /* 배경 핑크 박스를 가상 요소로 분리하여 크기와 위치를 개별 조정 */
        .calendar-wrapper::before {
            content: '';
            position: absolute;
            top: 55px; /* 요일 박스 세로 높이의 딱 절반에 걸치도록 수정 */
            bottom: -10px; /* 숫자 박스 하단 여백에 맞춰 축소 */
            left: -30px; /* 캘린더보다 가로 폭이 넓은 직사각형이 되도록 왼쪽 늘림 */
            right: -50px; /* 오른쪽도 넓게 늘려 넙적한 모양 강조 */
            background-color: #eebabe;
            z-index: -1;
        }

        /* 달력 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        /* 요일 및 날짜 공통 박스 스타일 */
        .box {
            background-color: #a53332;
            color: #f1efe2; 
            aspect-ratio: 1 / 1.1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 10px 0; /* 일정 추가 시 위아래 여백 확보 */
            font-size: 2rem;
            overflow-y: auto; /* 일정이 많아지면 안에서 스크롤 되도록 허용 */
            overflow-x: hidden;
            scrollbar-width: none; /* Firefox 스크롤바 숨김 */
            -ms-overflow-style: none; /* IE, Edge 스크롤바 숨김 */
        }

        /* 날짜 박스에 마우스를 올렸을 때 클릭 가능함을 표시 */
        .box:not(.day-header) {
            cursor: pointer;
        }

        .box::-webkit-scrollbar {
            display: none; /* Chrome, Safari 스크롤바 숨김 */
        }

        /* 요일 헤더 (s m t w t f s) */
        .day-header {
            background-color: #ca494d;
            aspect-ratio: 1 / 0.8;
            font-size: 2.5rem;
            text-transform: lowercase;
            margin-bottom: 10px;
            justify-content: center; /* 요일은 다시 가운데 정렬 */
            padding: 0; /* 요일 박스는 여백 초기화 */
        }

        /* 주말(일, 토) 글씨 색상을 캘린더 배경색(#eebabe)과 동일하게 설정 */
        .grid > .box:nth-child(7n + 1),
        .grid > .box:nth-child(7n) {
            color: #a8ddfe;
        }

    /* 요일 헤더 각각 다르게 기울이기 */
    .day-header:nth-child(1) { transform: rotate(-4deg); }
    .day-header:nth-child(2) { transform: rotate(3deg); }
    .day-header:nth-child(3) { transform: rotate(-2deg); }
    .day-header:nth-child(4) { transform: rotate(5deg); }
    .day-header:nth-child(5) { transform: rotate(-3deg); }
    .day-header:nth-child(6) { transform: rotate(4deg); }
    .day-header:nth-child(7) { transform: rotate(-5deg); }

        /* 일정 추가 버튼 */
        .add-btn {
            background-color: #ca494d;
            color: #f1efe2;
            font-size: 1.1rem; /* 글씨 크기 축소 */
            padding: 10px 25px; /* 박스 크기 전체적으로 아담하게 축소 */
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transform: rotate(4deg);
            transition: transform 0.2s ease, background-color 0.2s;
            margin-bottom: 15px; /* 하단 정렬 미세 조정 */
        }

        .add-btn:hover {
            transform: scale(1.1) rotate(-3deg);
            background-color: #a53332;
        }

        /* 빈칸 비정형 뾰족한 모양 (스플래시) */
        .empty-star {
            background-color: #a53332;
            aspect-ratio: 1 / 1.1;
            clip-path: polygon(50% 12%, 65% 35%, 88% 25%, 75% 48%, 92% 70%, 70% 70%, 78% 90%, 50% 78%, 22% 90%, 30% 70%, 8% 70%, 25% 48%, 12% 25%, 35% 35%);
            transform: scale(0.9) rotate(8deg); /* 크기 눈에 띄게 축소 및 살짝 회전 */
        }

        .empty-star:nth-child(even) {
            background-color: #ca494d;
            transform: scale(0.8) rotate(-12deg); /* 짝수도 크기 축소 */
        }

        /* 캘린더 칸 안에 추가된 일정 스티커 스타일 */
        .schedule-item {
            font-size: 0.85rem;
            background-color: #eebabe;
            color: #a53332;
            margin-top: 5px;
            padding: 2px 6px;
            border-radius: 4px;
            width: 90%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* 글씨가 길면 ...으로 표시 */
            border: 2px solid #a53332;
            flex-shrink: 0; /* 여러 개를 추가해도 스티커가 찌그러지지 않게 방지 */
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
        }

        .schedule-item:hover {
            opacity: 0.8;
            transform: scale(0.95);
        }

        /* 모달 (일정 추가 창) 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: none; /* 기본적으로 숨김 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #eebabe;
            padding: 35px; /* 세로 여백을 넉넉하게 늘려 높이 확보 */
            width: 400px; /* 가로 넓이 확대 */
            border: 4px solid #a53332;
            border-radius: 15px;
            text-align: center;
            box-shadow: 6px 6px 0px rgba(165, 51, 50, 0.4);
        }

        .modal-content h3 {
            color: #a53332;
            font-size: 2.2rem;
            margin-bottom: 25px; /* 제목 아래 여백 확대 */
            letter-spacing: 1px;
        }

        .modal-content input {
            width: 100%;
            padding: 15px; /* 입력창 높이 확대 */
            font-size: 1.2rem;
            border: 2px solid #a53332;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            color: #a53332;
            font-family: 'Londrina Solid', 'Do Hyeon', sans-serif; 
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal-buttons button {
            padding: 12px 24px; /* 버튼 상하좌우 크기 확대 */
            font-size: 1.3rem; /* 버튼 글씨 확대 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .modal-buttons button:active { transform: scale(0.95); }
        .btn-save { background-color: #ca494d; color: #f1efe2; }
        .btn-cancel { background-color: #a53332; color: #f1efe2; }
        .btn-delete { background-color: #555; color: #f1efe2; }

        /* 컬러 피커 스타일 */
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.selected {
            border: 3px solid #a53332;
            transform: scale(1.2);
        }

        /* 크게 보기 모달 내 일정 리스트 스타일 */
        #cellViewList {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 0 5px;
            scrollbar-width: thin;
        }
        
        .cell-view-item {
            background-color: #f1efe2;
            color: #a53332;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 1.2rem;
            border: 2px solid #a53332;
            text-align: left;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="poster">
        <div class="info-section">
            <div class="header-section">
                <div class="year">2026</div>
                <div class="month">JUNE</div>
            </div>
            <button class="add-btn" onclick="openModal()">+일정 추가</button>
        </div>
        
        <div class="calendar-container">
            <div class="calendar-wrapper">
            <div class="grid">
                <div class="box day-header">s</div>
                <div class="box day-header">m</div>
                <div class="box day-header">t</div>
                <div class="box day-header">w</div>
                <div class="box day-header">t</div>
                <div class="box day-header">f</div>
                <div class="box day-header">s</div>

                <div class="empty-star"></div>
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
                <div class="box">5</div>
                <div class="box">6</div>
                <div class="box">7</div>
                <div class="box">8</div>
                <div class="box">9</div>
                <div class="box">10</div>
                <div class="box">11</div>
                <div class="box">12</div>
                <div class="box">13</div>
                <div class="box">14</div>
                <div class="box">15</div>
                <div class="box">16</div>
                <div class="box">17</div>
                <div class="box">18</div>
                <div class="box">19</div>
                <div class="box">20</div>
                <div class="box">21</div>
                <div class="box">22</div>
                <div class="box">23</div>
                <div class="box">24</div>
                <div class="box">25</div>
                <div class="box">26</div>
                <div class="box">27</div>
                <div class="box">28</div>
                <div class="box">29</div>
                <div class="box">30</div>
                <div class="empty-star"></div>
                <div class="empty-star"></div>
                <div class="empty-star"></div>
                <div class="empty-star"></div>
            </div>
            </div>
        </div>
    </div>

    <!-- 일정 추가 모달 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>새 일정 추가</h3>
            <input type="text" id="dateInput" placeholder="날짜 입력 (예: 2 또는 2-6)">
            <input type="text" id="scheduleInput" placeholder="일정을 입력하세요">
            
            <div class="color-picker">
                <button class="color-btn" style="background-color: #ffffff;" onclick="selectColor('#ffffff', this)"></button>
                <button class="color-btn" style="background-color: #fdf2b3;" onclick="selectColor('#fdf2b3', this)"></button>
                <button class="color-btn" style="background-color: #cbe6c6;" onclick="selectColor('#cbe6c6', this)"></button>
                <button class="color-btn" style="background-color: #cce3eb;" onclick="selectColor('#cce3eb', this)"></button>
                <button class="color-btn" style="background-color: #e2d1eb;" onclick="selectColor('#e2d1eb', this)"></button>
            </div>

            <div class="modal-buttons">
                <button class="btn-save" onclick="saveSchedule()">저장</button>
                <button class="btn-cancel" onclick="closeModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- 일정 수정/삭제 모달 -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal-content">
            <h3>일정 관리</h3>
            <input type="text" id="editScheduleInput" placeholder="일정을 수정하세요">
            <div class="modal-buttons">
                <button class="btn-save" onclick="updateSchedule()">수정</button>
                <button class="btn-delete" onclick="deleteSchedule()">삭제</button>
                <button class="btn-cancel" onclick="closeEditModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- 일정 크게 보기 모달 -->
    <div class="modal-overlay" id="cellViewModalOverlay">
        <div class="modal-content">
            <h3 id="cellViewTitle">일정 보기</h3>
            <div id="cellViewList"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeCellViewModal()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        let selectedColor = '#ffffff';

        function selectColor(color, btnElement) {
            selectedColor = color;
            const btns = document.querySelectorAll('#modalOverlay .color-btn');
            btns.forEach(btn => btn.classList.remove('selected'));
            if(btnElement) btnElement.classList.add('selected');
        }

        function openModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
            selectColor('#ffffff', document.querySelector('#modalOverlay .color-btn')); // 모달 열 때 기본 색상(첫 번째) 선택
        }
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('scheduleInput').value = ''; // 창 닫을 때 입력값 초기화
            document.getElementById('dateInput').value = '';
        }
        function saveSchedule() {
            const dateStr = document.getElementById('dateInput').value.trim();
            const text = document.getElementById('scheduleInput').value.trim();
            
            if (!dateStr) return alert("날짜를 입력해주세요!");
            if (!text) return alert("일정을 입력해주세요!");

            let startDay, endDay;
            
            if (dateStr.includes('-')) {
                const parts = dateStr.split('-');
                startDay = parseInt(parts[0], 10);
                endDay = parseInt(parts[1], 10);
            } else {
                startDay = parseInt(dateStr, 10);
                endDay = startDay;
            }
            
            if (isNaN(startDay) || isNaN(endDay) || startDay < 1 || endDay > 30 || startDay > endDay) {
                return alert("1부터 30 사이의 유효한 날짜 또는 기간(예: 2-6)을 입력해주세요!");
            }
            
            const boxes = document.querySelectorAll('.grid .box:not(.day-header)');
            
            // 지정된 기간(또는 단일 날짜)만큼 반복하여 일정 스티커 추가
            for (let i = startDay; i <= endDay; i++) {
                const targetBox = boxes[i - 1];
                const scheduleDiv = document.createElement('div');
                scheduleDiv.className = 'schedule-item';
                scheduleDiv.textContent = text;
                scheduleDiv.style.backgroundColor = selectedColor;
                scheduleDiv.dataset.color = selectedColor; // 상세 보기 시 색상 유지를 위한 데이터 저장
                scheduleDiv.onclick = function(e) { 
                    e.stopPropagation(); // 칸 클릭(크게 보기) 이벤트와 겹치지 않게 방지
                    openEditModal(this); 
                };
                targetBox.appendChild(scheduleDiv);
            }

            closeModal();
        }

        let currentEditItem = null;

        function openEditModal(element) {
            currentEditItem = element;
            document.getElementById('editScheduleInput').value = element.textContent;
            document.getElementById('editModalOverlay').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModalOverlay').style.display = 'none';
            currentEditItem = null;
        }

        function updateSchedule() {
            if (!currentEditItem) return;
            const newText = document.getElementById('editScheduleInput').value.trim();
            if (!newText) return alert("일정을 입력해주세요!");
            currentEditItem.textContent = newText;
            closeEditModal();
        }

        function deleteSchedule() {
            if (!currentEditItem) return;
            if (confirm("이 일정을 삭제하시겠습니까?")) {
                currentEditItem.remove();
                closeEditModal();
            }
        }

        // 날짜 칸 클릭 시 크게 보기 기능 추가
        const dateBoxes = document.querySelectorAll('.grid .box:not(.day-header)');
        dateBoxes.forEach((box, index) => {
            box.addEventListener('click', function() {
                const schedules = this.querySelectorAll('.schedule-item');
                if (schedules.length > 0) {
                    openCellViewModal(index + 1, Array.from(schedules));
                }
            });
        });

        function openCellViewModal(day, schedules) {
            document.getElementById('cellViewTitle').textContent = `6월 ${day}일 일정`;
            const listContainer = document.getElementById('cellViewList');
            listContainer.innerHTML = ''; 

            schedules.forEach(sch => {
                const div = document.createElement('div');
                div.className = 'cell-view-item';
                div.textContent = sch.textContent;
                div.style.backgroundColor = sch.dataset.color || '#f1efe2';
                listContainer.appendChild(div);
            });
            document.getElementById('cellViewModalOverlay').style.display = 'flex';
        }

        function closeCellViewModal() {
            document.getElementById('cellViewModalOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
